version: 2.1

jobs:
  test:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: mvn install -DskipTests
      - run:
          name: Run Selenium Tests
          command: mvn test

workflows:
  version: 2
  run-tests:
    jobs:
      - test
